<svg
  xmlns="http://www.w3.org/2000/svg"
  width="200"
  height="320"
  viewBox="0 0 64 104"
  style="
    --color1: #ff6b81;
    --color2: #c44569;
  "
  role="img"
  aria-label="Globo"
>
  <defs>
    <!-- Color principal del globo -->
    <radialGradient
      id="balloon-body-light"
      cx="35%"
      cy="24%"
      r="78%"
      fx="35%"
      fy="24%"
    >
      <stop
        offset="0%"
        stop-color="var(--color1)"
      />

      <stop
        offset="64%"
        stop-color="var(--color1)"
      />

      <stop
        offset="100%"
        stop-color="var(--color2)"
      />
    </radialGradient>

    <!-- Brillo principal -->
    <linearGradient
      id="balloon-shine-light"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0%"
        stop-color="#ffffff"
        stop-opacity="0.78"
      />

      <stop
        offset="100%"
        stop-color="#ffffff"
        stop-opacity="0"
      />
    </linearGradient>

    <!-- Degradado de la cola -->
    <linearGradient
      id="balloon-tail-light"
      x1="0"
      y1="73"
      x2="0"
      y2="103"
      gradientUnits="userSpaceOnUse"
    >
      <stop
        offset="0%"
        stop-color="var(--color2)"
        stop-opacity="0.95"
      />

      <stop
        offset="100%"
        stop-color="var(--color2)"
        stop-opacity="0.55"
      />
    </linearGradient>

    <!-- Sombra -->
    <filter
      id="balloon-shadow-light"
      x="-35%"
      y="-25%"
      width="170%"
      height="175%"
    >
      <feDropShadow
        dx="0"
        dy="1.5"
        stdDeviation="1.5"
        flood-color="#000000"
        flood-opacity="0.28"
      />
    </filter>
  </defs>

  <!-- Cuerpo del globo -->
  <path
    d="
      M32 4
      C17.2 4 8 15.3 8 30.2
      C8 46.8 18.5 59.9 28.8 66.6
      C30.1 67.5 31.1 68.2 32 69
      C32.9 68.2 33.9 67.5 35.2 66.6
      C45.5 59.9 56 46.8 56 30.2
      C56 15.3 46.8 4 32 4
      Z
    "
    fill="url(#balloon-body-light)"
    stroke="var(--color2)"
    stroke-width="1.7"
    stroke-opacity="0.9"
    stroke-linejoin="round"
    filter="url(#balloon-shadow-light)"
  />

  <!-- Brillo lateral -->
  <path
    d="
      M19.7 17.8
      C16.7 23.4 17.9 35.9 24.8 43
      C29.5 37.5 30.8 27.5 27.8 20.2
      C26.6 17.2 23.5 16 19.7 17.8
      Z
    "
    fill="url(#balloon-shine-light)"
  />

  <!-- Reflejo pequeño -->
  <ellipse
    cx="25"
    cy="15.8"
    rx="4"
    ry="2.4"
    fill="#ffffff"
    opacity="0.38"
    transform="rotate(-12 25 15.8)"
  />

  <!-- Nudo -->
  <path
    d="
      M29.3 68.3
      Q32 70.1 34.7 68.3
      L35.3 72.8
      Q32 74.5 28.7 72.8
      Z
    "
    fill="var(--color2)"
    stroke="var(--color2)"
    stroke-width="0.8"
    stroke-linejoin="round"
  />

  <!-- Cola curva -->
  <path
    d="
      M32 73.7
      C31.2 78.3 37.2 80.1 35.3 84.8
      C33.5 89.3 26.4 89.8 28.1 94.5
      C29.5 98.3 35.9 97.1 37.1 102
    "
    fill="none"
    stroke="url(#balloon-tail-light)"
    stroke-width="1.45"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>